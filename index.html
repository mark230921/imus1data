<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>087 IMUS 1 - Feedback Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Brand Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-title-group h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand-title-group p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .stats-badge {
            background-color: #e2e8f0;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Main Card Container */
        .container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background-color: #ffffff;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .date-filter {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            background: #fff;
        }

        .btn-refresh, .btn-clear {
            padding: 9px 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-refresh {
            background-color: var(--accent);
            color: white;
        }

        .btn-refresh:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-clear {
            background-color: #e2e8f0;
            color: var(--primary);
        }

        .btn-clear:hover {
            background-color: #cbd5e1;
        }

        /* Table Styling & Internal Scroll */
        .table-responsive {
            width: 100%;
            max-height: 500px;
            overflow-y: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .name-tag {
            font-weight: 600;
            color: var(--primary);
        }

        .feedback-text {
            max-width: 350px;
            word-break: break-word;
            line-height: 1.5;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background-color: #danger;
            color: white;
        }

        .btn-delete:disabled {
            background-color: #f1f5f9;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        #loadingStatus {
            text-align: center;
            padding: 40px;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Modern Toast Notification */
        .toast {
            visibility: hidden;
            min-width: 280px;
            background-color: var(--primary);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 14px 20px;
            position: fixed;
            z-index: 10000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.success { background-color: #065f46; }
        .toast.error { background-color: #991b1b; }

        .toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Brand Header -->
    <div class="brand-header">
        <div class="brand-title-group">
            <h1>Submission Data</h1>
            <p>Store Branch: 087 IMUS 1</p>
        </div>
        <div class="stats-badge" id="recordCount">Loading records...</div>
    </div>

    <!-- Dashboard Card Container -->
    <div class="container">
        <div class="card-header">
            <h2>Customer Submissions</h2>
            <div class="controls-group">
                <!-- Date Filter Search Box -->
                <input type="date" id="dateFilter" class="date-filter" title="Filter by Visit Date" onchange="filterRecords()">
                <button class="btn-clear" onclick="clearDateFilter()" title="Clear Filter">Show All</button>
                <button class="btn-refresh" onclick="fetchRecords()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.63-5.05"/></svg>
                    Refresh Data
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Submit Date</th>
                        <th>Full Name</th>
                        <th>Suggestion / Feedback</th>
                        <th>Visit Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <!-- Rows dynamically injected -->
                </tbody>
            </table>
            <div id="loadingStatus">Fetching recorded feedback from Google Sheet...</div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toastMessage" class="toast"></div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby-4-ds8_6Wb27ED6oQtD97ITtVa8cq3MA3Y1t6ckgbFBqMD1_tZvd1WmyB3INXq2Xvcg/exec';

    const tableBody = document.getElementById('recordsTableBody');
    const loadingStatus = document.getElementById('loadingStatus');
    const toastMessage = document.getElementById('toastMessage');
    const recordCountBadge = document.getElementById('recordCount');
    const dateFilterInput = document.getElementById('dateFilter');

    let allRecords = []; // Master dataset copy for filtering

    function showToast(message, type = 'success') {
        toastMessage.textContent = message;
        toastMessage.className = 'toast ' + type + ' show';
        setTimeout(() => {
            toastMessage.className = 'toast';
        }, 3000);
    }

    function fetchRecords() {
        loadingStatus.style.display = 'block';
        loadingStatus.textContent = 'Loading records...';
        tableBody.innerHTML = '';
        recordCountBadge.textContent = 'Updating...';

        fetch(scriptURL, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(response => {
                loadingStatus.style.display = 'none';
                if (response.result === 'success') {
                    allRecords = response.data;
                    filterRecords();
                } else {
                    recordCountBadge.textContent = 'Error';
                    showToast('Failed to load records.', 'error');
                }
            })
            .catch(error => {
                loadingStatus.style.display = 'block';
                loadingStatus.textContent = 'Error connecting to database.';
                recordCountBadge.textContent = 'Connection Error';
                console.error('Error:', error);
            });
    }

    // Helper to format date strings to "Month Day, Year" (e.g. June 6, 2026)
    function formatNiceDate(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('T')[0].split('-');
        if (parts.length !== 3) return dateString;
        
        const year = parseInt(parts[0], 10);
        const monthIndex = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);

        const dateObj = new Date(year, monthIndex, day);
        if (isNaN(dateObj)) return dateString;

        return dateObj.toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
    }

    // Helper to format timestamp into full month-name format with time (e.g. June 6, 2026, 2:30 PM)
    function formatNiceTimestamp(timestampString) {
        if (!timestampString) return '';
        const dateObj = new Date(timestampString);
        if (isNaN(dateObj)) return timestampString; // Fallback if format is unrecognized

        return dateObj.toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
    }

    function filterRecords() {
        const selectedDate = dateFilterInput.value;
        let filteredData = allRecords;

        if (selectedDate) {
            filteredData = allRecords.filter(row => {
                if (!row.visitDate) return false;
                const rowDateOnly = row.visitDate.split('T')[0];
                return rowDateOnly === selectedDate;
            });
        }

        recordCountBadge.textContent = `${filteredData.length} Total Entries`;

        if (filteredData.length === 0) {
            loadingStatus.style.display = 'block';
            loadingStatus.textContent = selectedDate ? `No feedback found for visit date: ${formatNiceDate(selectedDate)}` : 'No recorded feedback found.';
            tableBody.innerHTML = '';
            return;
        }

        loadingStatus.style.display = 'none';
        renderTable(filteredData);
    }

    function clearDateFilter() {
        dateFilterInput.value = '';
        filterRecords();
    }

    function renderTable(records) {
        tableBody.innerHTML = '';
        records.forEach(row => {
            const tr = document.createElement('tr');
            
            // Format Submit Date and Visit Date into clean month name formats
            const niceTimestamp = formatNiceTimestamp(row.timestamp);
            const niceVisitDate = formatNiceDate(row.visitDate);

            tr.innerHTML = `
                <td>${niceTimestamp}</td>
                <td><span class="name-tag">${row.fullName || 'ANONYMOUS'}</span></td>
                <td><div class="feedback-text">${row.feedback || ''}</div></td>
                <td>${niceVisitDate}</td>
                <td>
                    <button class="btn-delete" onclick="deleteRecord(${row.rowIndex}, this)">Delete</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function deleteRecord(rowIndex, btnElement) {
        if (!confirm('Are you sure you want to delete this record?')) return;

        btnElement.disabled = true;
        btnElement.textContent = 'Deleting...';

        const params = new URLSearchParams();
        params.append('action', 'delete');
        params.append('rowIndex', rowIndex);

        fetch(scriptURL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: params
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'success') {
                showToast('Record deleted successfully!', 'success');
                fetchRecords();
            } else {
                showToast('Failed to delete record.', 'error');
                btnElement.disabled = false;
                btnElement.textContent = 'Delete';
            }
        })
        .catch(err => {
            showToast('Error deleting record.', 'error');
            btnElement.disabled = false;
            btnElement.textContent = 'Delete';
            console.error('Error:', err);
        });
    }

    window.addEventListener('DOMContentLoaded', fetchRecords);
</script>

</body>
</html>
